<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Bo Rangers FC Sierra Leone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Bo Rangers FC Sierra Leone</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="players.html">Players</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="content-section">
            <div class="container">
                <h2>Contact Us</h2>
                <div id="contact-grid">
                    <div class="contact-info">
                        <div>
                            <h4>Address</h4>
                            <p>Wilberforce Street, Freetown, Sierra Leone</p>
                        </div>
                        <div>
                            <h4>Phone</h4>
                            <p>+232 78 123 456</p>
                        </div>
                        <div>
                            <h4>Email</h4>
                            <p>info@fasl.sl</p>
                        </div>
                        
                        <div class="social-links">
                            <h4>Follow Us</h4>
                            <a href="#" title="Facebook">f</a> 
                            <a href="#" title="Twitter/X">X</a>
                            <a href="#" title="Instagram">i</a>
                        </div>
                    </div>
                    
                    <div class="contact-form">
                        <h3>Send us a message</h3>
                        <form action="#" method="POST">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                            
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                            
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" name="subject">
                            
                            <label for="message">Message</label>
                            <textarea id="message" name="message" required></textarea>
                            
                            <button type="submit">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Bo Rangers FC Sierra Leone. All Rights Reserved.</p>
    </footer>
</body>
</html>
